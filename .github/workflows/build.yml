name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/*"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python unit tests
        run: |
          python3 -m unittest discover tests

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add Android targets to Rust toolchain
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Run Rust unit tests
        run: |
          cd rust/nuppacker-core
          cargo test --verbose

      - name: Configure Android NDK for cargo-ndk
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_LATEST=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$NDK_LATEST" >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_LATEST" >> $GITHUB_ENV
          fi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Libraries (Android ABIs)
        run: |
          cd rust/nuppacker-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK and generate checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cd dist
          sha256sum *.apk | tee SHA256SUMS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuppacker-android-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
